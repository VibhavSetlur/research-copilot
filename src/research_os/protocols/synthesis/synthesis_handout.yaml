id: synthesis_handout
tier: 'synthesize'
name: Synthesis — Printable Handout / One-Pager (redirect)
version: '3.0.0'
schema_version: '3.0'
scope_tags:
  domain: [any]
  audience: [auditor]
  workflow_shape: [any]
last_reviewed: '2026-06-16'
description: |
  Redirect stub. The handout / one-pager content lives in
  `synthesis/printable.yaml` parametrized by `format='handout'`.
  Loading this name continues to work (loader follows redirect_to);
  the deprecation is logged to `.os_state/deprecations.log` so the
  project can audit usage. Use `synthesis/printable` directly going
  forward.

redirect_to: synthesis/printable
redirect_params:
  format: handout
intent_class: synthesize
sub_intent: handout
triggers:
- make a one-pager
- one pager
- make a handout
- printable handout
- handout for the poster session
- one-page summary
- for the audience to take away
- leave-behind for the meeting
- leave behind for the meeting
summary: Single-page printable handout / one-pager (5 audience profiles, QR code mandatory). Redirects to synthesis/printable(format=handout).
token_estimate: 1500
decomposition:
- protocol: synthesis/printable
  purpose: 'Loaded via redirect from synthesis_handout: format=handout.'
