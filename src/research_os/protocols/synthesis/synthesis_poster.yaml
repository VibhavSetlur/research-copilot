id: synthesis_poster
tier: 'synthesize'
name: Synthesis — Poster (redirect)
version: '3.0.0'
schema_version: '3.0'
scope_tags:
  domain: [any]
  audience: [auditor]
  workflow_shape: [any]
last_reviewed: '2026-06-16'
description: |
  Redirect stub. Poster content lives in
  `synthesis/printable.yaml` parametrized by `format='poster'`.
  Loading this name continues to work (loader follows redirect_to);
  the deprecation is logged to `.os_state/deprecations.log` so the
  project can audit usage. Use `synthesis/printable` directly going
  forward.

redirect_to: synthesis/printable
redirect_params:
  format: poster
intent_class: synthesize
sub_intent: poster
triggers:
- make a poster
- make me a poster
- build me a poster
- create a poster
- build a poster
- conference poster
- academic poster
- poster
- i need a poster
summary: AI authors poster.typ; tool_typst_compile renders PDF. Redirects to synthesis/printable(format=poster).
shortcut_tool: tool_synthesis_scaffold
