    - fix workspace
    - fix the workspace
    - repair
    - repair the workspace
    tool: tool_migrate_audit
  background_task:
    triggers:
    - background
    - long running
    - kick off
    - fire and forget
    tool: tool_task
  run_build_checks:
    triggers:
    - run the tests
    - run tests
    - run the test suite
    - run the build
    - run the linter
    - run the linters
    - run the checks
    - run lint
    - rerun the tests
    tool: tool_build
  scratch_sandbox:
    triggers:
    - quick test
    - syntax check
    - scratch
    - throwaway
    tool: tool_scratch
  step_iterate:
    triggers:
    - iterate on this step
    - iterate the figure
    - iterate the analysis
    - iterate on figure
    - iterate on the figure
    - rerun with different
    - recolor figure
    - recolour figure
    - tighten the cutoff
    - tighten cutoff
    - swap the model
    - snapshot this version
    - version this iteration
    - design iteration
