    - score the work
    - rate this work
    - rate the work
    - is this good enough
    - is this good enough to ship
    - good enough to ship
    - is this ready to ship
    - how good is this
    - judge this work
    - judge the work
    - assess the quality
    - what are the limitations
    - ship iterate or redo
