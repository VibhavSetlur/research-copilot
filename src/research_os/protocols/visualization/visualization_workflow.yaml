summary: Build / polish a figure or figure deck without committing to the full analysis_plan loop.
token_estimate: 1500
decomposition:
- protocol: visualization/visualization_workflow
  purpose: Scope + plan figures, then build via an AI-authored plotting script (see visualization/figure_guidelines).
- tool: tool_audit
  purpose: Audit each figure (scope='step', dimension='figure_full').
